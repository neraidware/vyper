name: windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ODIN_VERSION: dev-2026-09
  SDL3_VER: 3.4.14

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same compiler line as .mise.toml. This was dev-2026-07a while the dev
      # machine tracked dev-2026-09, so CI was validating a build two months
      # behind the one the gates actually run -- a compiler bump changes codegen,
      # which is exactly what a build gate is supposed to catch.
      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_VERSION }}

      # Prebuilt dependency binaries (no vcpkg-from-source: ffmpeg cold builds
      # take 20+ min). SDL3 MSVC dev package provides the SDL3.lib import lib
      # Odin's vendored binding links, plus SDL3.dll to ship at runtime.
      - name: Download SDL3 (dev)
        shell: pwsh
        run: |
          curl.exe -sL -o sdl.zip `
            "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL3_VER/SDL3-devel-$env:SDL3_VER-VC.zip"
          Expand-Archive -Path sdl.zip -DestinationPath deps
          New-Item -ItemType Directory -Path deps\include,deps\lib -Force | Out-Null
          Copy-Item "deps\SDL3-$env:SDL3_VER\include\*" deps\include -Recurse -Force
          Copy-Item "deps\SDL3-$env:SDL3_VER\lib\x64\SDL3.lib" deps\lib\ -Force
          Copy-Item "deps\SDL3-$env:SDL3_VER\lib\x64\SDL3.dll" deps\ -Force

      # Prebuilt shared ffmpeg (BtbN auto-build). Provides the import libs
      # (avformat.lib, avcodec.lib, ...) Odin's binding links, plus the runtime
      # dlls vyper loads in-process. The ffmpeg.exe / ffprobe.exe CLIs are kept
      # in deps\ ONLY to generate the smoke-test sample video -- the app no
      # longer shells out for media (all probe/transcode is in-process), so they
      # must not be shipped in dist. Shipping them is ~180 MB of dead weight
      # that filled the artifact quota.
      # NOTE: vendor:ffmpeg declares its Windows import as a bare relative name
      # `foreign import "<lib>.lib"`, which Odin resolves *relative to the source
      # file dir* (vendor/ffmpeg/<lib>/<lib>.lib), then passes as an absolute file
      # to link.exe so /LIBPATH does NOT apply. So we must drop each import lib in
      # the exact vendor slot Odin expects, in addition to deps\lib (for SDL3).
      - name: Download ffmpeg (prebuilt shared)
        shell: pwsh
        run: |
          curl.exe -sL -o ffmpeg.zip `
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl-shared.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg
          $src = "ffmpeg\ffmpeg-master-latest-win64-gpl-shared"
          Copy-Item "$src\lib\*.lib" deps\lib\ -Force
          Copy-Item "$src\bin\*.dll" deps\ -Force
          Copy-Item "$src\bin\ffmpeg.exe" deps\ -Force
          Copy-Item "$src\bin\ffprobe.exe" deps\ -Force
          # Drop import libs into vendor/ffmpeg/<lib>/<lib>.lib for the libs the
          # app actually binds (relative foreign-import resolution).
          foreach ($l in @("avcodec","avfilter","avformat","avutil","swresample","swscale")) {
            Copy-Item "deps\lib\$l.lib" "vendor\ffmpeg\$l\$l.lib" -Force
          }

      # build.odin drives cl and lib on Windows, so MSVC has to be on PATH
      # before it runs.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # The build is build.odin, the same program the dev machine and the nix
      # package use. It picks cl/lib and the MSVC link line by itself; the only
      # thing it cannot know is where CI staged the SDL3/ffmpeg import libs, so
      # that path is handed over. Its shader list is also the real one: the list
      # that used to live here had drifted and named two shaders that no longer
      # exist while missing both nv12 stages.
      - name: Build vyper
        shell: pwsh
        run: |
          # Odin's vendored SDL3 / ffmpeg bindings reference the .lib import libs
          # by name. SDL3 is imported via `{ "SDL3.lib" }`, passed to link.exe as
          # a name and resolved via /LIBPATH -> deps\lib. ffmpeg import libs were
          # dropped into vendor/ffmpeg/<lib>/ by the previous step, and
          # FFMPEG_LINK=system is what selects them.
          $env:VYPER_LINK_FLAGS = "/LIBPATH:$PWD\deps\lib /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup"
          $env:VYPER_OUT = "vyper.exe"
          ./build.odin release
          if ($LASTEXITCODE -ne 0) { throw "build.odin failed (exit $LASTEXITCODE)" }

      - name: Stage dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item vyper.exe dist\vyper.exe -Force
          # SDL3 + ffmpeg runtime dlls must sit beside the exe; the ffmpeg/ffprobe
          # CLIs stay behind in deps\ (smoke-only, not shipped).
          Get-ChildItem deps\*.dll | Copy-Item -Destination dist -Force
          Get-ChildItem dist | Select-Object Name,Length

      # Smoke test the shipped dist headlessly: generate a sample, decode a
      # frame range through the vendored ffmpeg DLLs (NERED_FRAME_PROBE), then
      # build a proxy with the bundled ffmpeg.exe and verify proxy/source
      # parity (NERED_PROXY_PROBE). A dist whose DLL set or decode path is
      # broken dies HERE with a non-zero exit -- and vyper_crash.log next to
      # the exe is captured into the log so the fault is diagnosable without
      # a Windows box. This is what would have caught "crashes as soon as I
      # open a video" upstream of the artifact.
      - name: Smoke test (decode + proxy)
        shell: pwsh
        run: |
          # vyper.exe is /SUBSYSTEM:WINDOWS; its stdout only exists when
          # redirected, so every run writes a log that we dump on failure/success.
          $env:PATH = "$PWD\dist;$env:PATH"
          & .\deps\ffmpeg.exe -y -loglevel error -f lavfi -i testsrc2=duration=8:size=320x180:rate=30 -frames:v 240 -pix_fmt yuv420p sample.mp4
          if ($LASTEXITCODE -ne 0) { throw "sample generation failed (exit $LASTEXITCODE)" }

          Remove-Item -ErrorAction SilentlyContinue .\smoke_frame.log
          $env:NERED_FRAME_PROBE = "sample.mp4|0-239|30"
          & .\dist\vyper.exe > .\smoke_frame.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\smoke_frame.log
            if (Test-Path .\dist\vyper_crash.log) { Get-Content .\dist\vyper_crash.log }
            throw "frame-probe failed (exit $LASTEXITCODE)"
          }
          Remove-Item Env:NERED_FRAME_PROBE

          Remove-Item -ErrorAction SilentlyContinue .\smoke_proxy.log
          $env:NERED_PROXY_PROBE = "sample.mp4"
          & .\dist\vyper.exe > .\smoke_proxy.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\smoke_proxy.log
            if (Test-Path .\dist\vyper_crash.log) { Get-Content .\dist\vyper_crash.log }
            throw "proxy-probe failed (exit $LASTEXITCODE)"
          }

          if (Test-Path .\dist\vyper_crash.log) {
            Get-Content .\dist\vyper_crash.log
            throw "vyper_crash.log present after smoke test"
          }
          Get-Content .\smoke_frame.log
          Get-Content .\smoke_proxy.log

      - name: Upload artifact
        # Best-effort: a quota hiccup on the account must not red a build whose
        # compile and smoke both passed. Artifact storage is account-wide and
        # GitHub only recalculates usage every 6-12h after deletions, so this
        # step can fail while there is genuinely nothing wrong with the build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vyper-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7