name: windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ODIN_VERSION: dev-2026-07a
  SDL3_VER: 3.4.14

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_VERSION }}

      # Prebuilt dependency binaries (no vcpkg-from-source: ffmpeg cold builds
      # take 20+ min). SDL3 MSVC dev package provides the SDL3.lib import lib
      # Odin's vendored binding links, plus SDL3.dll to ship at runtime.
      - name: Download SDL3 (dev)
        shell: pwsh
        run: |
          curl.exe -sL -o sdl.zip `
            "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL3_VER/SDL3-devel-$env:SDL3_VER-VC.zip"
          Expand-Archive -Path sdl.zip -DestinationPath deps
          New-Item -ItemType Directory -Path deps\include,deps\lib -Force | Out-Null
          Copy-Item "deps\SDL3-$env:SDL3_VER\include\*" deps\include -Recurse -Force
          Copy-Item "deps\SDL3-$env:SDL3_VER\lib\x64\SDL3.lib" deps\lib\ -Force
          Copy-Item "deps\SDL3-$env:SDL3_VER\lib\x64\SDL3.dll" deps\ -Force

      # Prebuilt shared ffmpeg (BtbN auto-build). Provides the import libs
      # (avformat.lib, avcodec.lib, ...) Odin's binding links, plus the runtime
      # dlls and the ffmpeg.exe / ffprobe.exe nered shells out to.
      # NOTE: vendor:ffmpeg declares its Windows import as a bare relative name
      # `foreign import "<lib>.lib"`, which Odin resolves *relative to the source
      # file dir* (vendor/ffmpeg/<lib>/<lib>.lib), then passes as an absolute file
      # to link.exe so /LIBPATH does NOT apply. So we must drop each import lib in
      # the exact vendor slot Odin expects, in addition to deps\lib (for SDL3).
      - name: Download ffmpeg (prebuilt shared)
        shell: pwsh
        run: |
          curl.exe -sL -o ffmpeg.zip `
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl-shared.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg
          $src = "ffmpeg\ffmpeg-master-latest-win64-gpl-shared"
          Copy-Item "$src\lib\*.lib" deps\lib\ -Force
          Copy-Item "$src\bin\*.dll" deps\ -Force
          Copy-Item "$src\bin\ffmpeg.exe" deps\ -Force
          Copy-Item "$src\bin\ffprobe.exe" deps\ -Force
          # Drop import libs into vendor/ffmpeg/<lib>/<lib>.lib for the libs the
          # app actually binds (relative foreign-import resolution).
          foreach ($l in @("avcodec","avformat","avutil","swresample","swscale")) {
            Copy-Item "deps\lib\$l.lib" "vendor\ffmpeg\$l\$l.lib" -Force
          }

      - name: Compile shaders (best-effort, .spv are committed)
        shell: pwsh
        run: |
          # Shader .spv artifacts are already committed; recompile here when a
          # glslangValidator is available (e.g. Vulkan SDK on the runner) so a
          # shader change gets caught, but do not fail the build without it.
          if (Get-Command glslangValidator -ErrorAction SilentlyContinue) {
            foreach ($src in @("rounded_rect.vert","rounded_rect.frag","text.vert","text.frag","preview.frag")) {
              glslangValidator -V "shaders\$src" -o "shaders\$src.spv"
              if ($LASTEXITCODE -ne 0) { throw "glslang failed on $src" }
            }
          } else {
            Write-Host "glslangValidator not found; using committed .spv files"
          }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile nanosvg (SVG renderer)
        shell: pwsh
        run: |
          # Instantiate the vendored parser+rasterizer. Mirrors the .o step in
          # flake.nix; nerd receives it through foreign import (vendor/nanosvg).
          cl /nologo /O2 /c vendor\nanosvg\nanosvg.c /Fovendor\nanosvg\nanosvg.obj

      - name: Compile clay (UI layout library)
        shell: pwsh
        run: |
          # Instantiate the vendored single-header clay into its link archive,
          # the same slot the committed prebuilt used. Mirrors the flake.nix
          # step so the shipped build always matches vendor/clay.h.
          cl /nologo /O2 /c vendor\clay.c /Fovendor\clay.obj
          lib /nologo /OUT:clay-odin\windows\clay.lib vendor\clay.obj

      - name: Build nered
        shell: pwsh
        run: |
          # Odin's vendored SDL3 / ffmpeg bindings reference the .lib import libs
          # Run odin. SDL3 is imported via the `{ "SDL3.lib" }` form, which is passed to
          # link.exe as a name and resolved via /LIBPATH -> deps\lib. ffmpeg import
          # libs were dropped into vendor/ffmpeg/<lib>/ by the previous step.
          odin build . -out:nered.exe `
            -define:FFMPEG_LINK=system `
            -extra-linker-flags:"/LIBPATH:$PWD\deps\lib /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup" `
            -show-timings

      - name: Stage dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item nered.exe dist\nered.exe -Force
          # SDL3 + ffmpeg runtime dlls, plus ffmpeg.exe/ffprobe.exe that nered
          # shells out to, must sit beside the exe.
          Get-ChildItem deps\*.dll | Copy-Item -Destination dist -Force
          Copy-Item -Path deps\ffmpeg.exe, deps\ffprobe.exe -Destination dist -Force
          Get-ChildItem dist | Select-Object Name,Length

      # Smoke test the shipped dist headlessly: generate a sample, decode a
      # frame range through the vendored ffmpeg DLLs (NERED_FRAME_PROBE), then
      # build a proxy with the bundled ffmpeg.exe and verify proxy/source
      # parity (NERED_PROXY_PROBE). A dist whose DLL set or decode path is
      # broken dies HERE with a non-zero exit -- and nered_crash.log next to
      # the exe is captured into the log so the fault is diagnosable without
      # a Windows box. This is what would have caught "crashes as soon as I
      # open a video" upstream of the artifact.
      - name: Smoke test (decode + proxy)
        shell: pwsh
        run: |
          # nered.exe is /SUBSYSTEM:WINDOWS; its stdout only exists when
          # redirected, so every run writes a log that we dump on failure/success.
          $env:PATH = "$PWD\dist;$env:PATH"
          & .\dist\ffmpeg.exe -y -loglevel error -f lavfi -i testsrc2=duration=8:size=320x180:rate=30 -frames:v 240 -pix_fmt yuv420p sample.mp4
          if ($LASTEXITCODE -ne 0) { throw "sample generation failed (exit $LASTEXITCODE)" }

          Remove-Item -ErrorAction SilentlyContinue .\smoke_frame.log
          $env:NERED_FRAME_PROBE = "sample.mp4|0-239|30"
          & .\dist\nered.exe > .\smoke_frame.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\smoke_frame.log
            if (Test-Path .\dist\nered_crash.log) { Get-Content .\dist\nered_crash.log }
            throw "frame-probe failed (exit $LASTEXITCODE)"
          }
          Remove-Item Env:NERED_FRAME_PROBE

          Remove-Item -ErrorAction SilentlyContinue .\smoke_proxy.log
          $env:NERED_PROXY_PROBE = "sample.mp4"
          & .\dist\nered.exe > .\smoke_proxy.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content .\smoke_proxy.log
            if (Test-Path .\dist\nered_crash.log) { Get-Content .\dist\nered_crash.log }
            throw "proxy-probe failed (exit $LASTEXITCODE)"
          }

          if (Test-Path .\dist\nered_crash.log) {
            Get-Content .\dist\nered_crash.log
            throw "nered_crash.log present after smoke test"
          }
          Get-Content .\smoke_frame.log
          Get-Content .\smoke_proxy.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nered-windows
          path: dist/
          if-no-files-found: error